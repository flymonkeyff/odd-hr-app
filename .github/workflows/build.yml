# ODD HR 빌드와 배포
#   1. 시험      서버 권한 시험(68개) + 앱 전체 흐름 시험(아이폰 화면 포함). 실패하면 아무것도 만들지 않는다.
#   2. 만들기    Windows(압축, 설치형), Mac(Apple 실리콘, 인텔), 웹(아이폰·아이패드)
#   3. 무결성    압축 CRC, 앱 안 파일 = 소스, 공개 키만, 칩 종류, SHA-256 목록. 실패하면 배포하지 않는다.
#   4. 배포      Releases(다운로드 파일 + SHA256SUMS.txt), GitHub Pages(웹 앱 + 다운로드 페이지)
# Actions 탭 → "ODD HR 빌드" → Run workflow 로 돌린다.
name: ODD HR 빌드

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oddhr-build
  cancel-in-progress: false

jobs:
  test:
    name: 시험 (서버 권한, 앱 전체 흐름)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: 화면 파일이 소스와 맞는지 (tools/desk-source.html → app/)
        run: |
          python3 tools/build_ui.py
          git diff --exit-code app/index.html app/desk.js || (echo "app/ 파일이 소스에서 다시 만든 것과 다릅니다. python3 tools/build_ui.py 후 커밋하세요." && exit 1)
      - name: 서버 권한 시험
        run: npm run test:server
      - name: 자동 업데이트 시험 (지문이 다른 파일은 설치하지 않음)
        run: npm run test:updater
      - name: 앱 전체 흐름 시험 (PM, 팀원, 아이폰 화면)
        run: |
          npx playwright install --with-deps chromium
          npm run vendor
          mkdir -p e2e-agent/kakaotalk_mcp
          cp test/fake-kakao/kakaotalk_mcp/*.py e2e-agent/kakaotalk_mcp/
          cp agent/oddhr_*.py e2e-agent/kakaotalk_mcp/
          AGENT_DIR=$PWD/e2e-agent OUT_DIR=$PWD/e2e-shots npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 시험-화면
          path: e2e-shots/*.png

  agent:
    name: 카톡 에이전트 (Windows 실행 파일)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 카카오톡 연결 모듈 받기 (검토한 고정 버전)
        shell: pwsh
        run: |
          $c = "4cf1a996396edfbe5fa5e4acf368877a65abb0bb"
          Invoke-WebRequest "https://github.com/jjround/kakaotalk-mcp/archive/$c.zip" -OutFile k.zip
          Expand-Archive k.zip -DestinationPath k
          Move-Item "k/kakaotalk-mcp-$c" kmcp
          Copy-Item agent/oddhr_*.py kmcp/src/kakaotalk_mcp/
      - run: pip install pyinstaller==6.11.1 pywin32==308
      - name: 실행 파일 만들기
        run: >
          pyinstaller --onefile --console --name odd-hr-agent --paths kmcp/src
          --hidden-import kakaotalk_mcp.kakao --hidden-import kakaotalk_mcp.parse
          --hidden-import kakaotalk_mcp.oddhr_agent --hidden-import kakaotalk_mcp.oddhr_extract --hidden-import kakaotalk_mcp.oddhr_llm
          --distpath agent-dist agent/entry.py
      - name: 실행 파일 시험
        shell: pwsh
        run: |
          $out = & agent-dist/odd-hr-agent.exe --json status
          Write-Host $out
          if (-not ($out -match '"ok": true')) { throw "에이전트가 응답하지 않습니다" }
      - name: 규칙 엔진 채점
        env:
          PYTHONIOENCODING: utf-8
        run: python agent/eval/score.py 카톡-할일-판정-최종검증.csv
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: agent-dist/odd-hr-agent.exe

  agent-mac:
    name: 카톡 에이전트 (Mac ${{ matrix.arch }})
    needs: test
    strategy:
      matrix:
        include:
          - { arch: arm64, os: macos-latest }
          - { arch: x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 꾸러미 만들기 (Mac 읽기 모듈 + 같은 판정 엔진)
        run: |
          c=4cf1a996396edfbe5fa5e4acf368877a65abb0bb
          curl -sSL "https://github.com/jjround/kakaotalk-mcp/archive/$c.tar.gz" | tar xz
          mkdir -p kmac/kakaotalk_mcp
          touch kmac/kakaotalk_mcp/__init__.py
          cp "kakaotalk-mcp-$c/src/kakaotalk_mcp/parse.py" kmac/kakaotalk_mcp/
          cp agent/kakao_mac.py kmac/kakaotalk_mcp/kakao.py
          cp agent/oddhr_*.py kmac/kakaotalk_mcp/
      - run: pip install pyinstaller==6.11.1
      - name: 실행 파일 만들기
        run: >
          pyinstaller --onefile --console --name odd-hr-agent --paths kmac
          --hidden-import kakaotalk_mcp.kakao --hidden-import kakaotalk_mcp.parse
          --hidden-import kakaotalk_mcp.oddhr_agent --hidden-import kakaotalk_mcp.oddhr_extract --hidden-import kakaotalk_mcp.oddhr_llm
          --distpath agent-dist agent/entry.py
      - name: 실행 파일 시험 (내보낸 카톡 파일로 점검)
        run: |
          file agent-dist/odd-hr-agent
          export ODD_HR_HOME=$PWD/agent-home
          mkdir -p exp
          printf '시험방 님과 카카오톡 대화\n--------------- 2026년 11월 10일 화요일 ---------------\n[홍길동] [오후 3:10] 편집본 v02 내일 오전까지 드라이브에 올릴게요\n' > exp/시험방.txt
          ./agent-dist/odd-hr-agent --json config-set "{\"rooms\":[\"시험방\"],\"mac_export_dir\":\"$PWD/exp\"}" > /dev/null
          out=$(./agent-dist/odd-hr-agent --json scan 시험)
          echo "$out"
          echo "$out" | grep -q '"tasks": 1' || (echo "Mac 에이전트가 내보낸 파일에서 할 일을 찾지 못했습니다" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: agent-mac-${{ matrix.arch }}
          path: agent-dist/odd-hr-agent

  windows:
    name: Windows 앱
    needs: agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent
          path: agent-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win
        env:
          # 코드 서명 인증서가 있으면 electron-builder가 설치 파일과 앱에 서명한다 (없으면 서명 없이)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ODD-HR-Windows
          path: |
            dist/*.exe
            dist/*-win.zip

  mac:
    name: Mac 앱
    needs: agent-mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: agent-mac-arm64
          path: agent-arm64
      - uses: actions/download-artifact@v4
        with:
          name: agent-mac-x64
          path: agent-x64
      - name: 칩별 앱 만들기 (각 칩에 맞는 카톡 에이전트를 넣는다)
        run: |
          npm run vendor
          for a in arm64 x64; do
            rm -rf agent-dist && mkdir agent-dist && cp agent-$a/odd-hr-agent agent-dist/ && chmod +x agent-dist/odd-hr-agent
            npx electron-builder --mac --$a --dir --publish never
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: 서명 (Apple 개발자 인증서가 있으면 Developer ID 서명과 공증, 없으면 임시 서명)
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "Developer ID로 서명하고 공증합니다"
            echo "$MAC_CSC_LINK" | base64 --decode > cert.p12
            security create-keychain -p ci build.keychain && security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain && security set-keychain-settings -t 3600 build.keychain
            security import cert.p12 -k build.keychain -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null
            ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
            echo "IDENTITY=$ID" >> "$GITHUB_ENV"
          else
            echo "IDENTITY=-" >> "$GITHUB_ENV"
            echo "인증서가 없어 임시 서명합니다 (첫 실행 때 Mac이 확인을 묻습니다)"
          fi
      - name: 서명 적용, 서명 검증, zip과 dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for pair in "mac-arm64:apple-silicon" "mac:intel"; do
            dir="${pair%%:*}"; name="${pair##*:}"
            A="$(ls -d dist/$dir/*.app | head -1)"
            if [ "$IDENTITY" = "-" ]; then
              codesign --force --sign - "$A/Contents/Resources/agent/odd-hr-agent"
              codesign --force --deep --sign - "$A"
            else
              OPT="--force --timestamp --options runtime --entitlements build/entitlements.mac.plist --sign"
              codesign $OPT "$IDENTITY" "$A/Contents/Resources/agent/odd-hr-agent"
              find "$A/Contents/Frameworks" \( -name "*.dylib" -o -name "*.so" \) -exec codesign $OPT "$IDENTITY" {} \;
              for f in "$A"/Contents/Frameworks/*.framework "$A"/Contents/Frameworks/*.app; do codesign $OPT "$IDENTITY" "$f"; done
              codesign $OPT "$IDENTITY" "$A"
              ditto -c -k --keepParent "$A" notarize.zip
              xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$A"
              rm notarize.zip
            fi
            codesign --verify --deep --strict --verbose=2 "$A"
            ditto -c -k --sequesterRsrc --keepParent "$A" "dist/ODD-HR-$VERSION-mac-$name.zip"
            # 처음 설치용 dmg: 열면 'ODD HR'을 '응용 프로그램'으로 끌어다 놓는 창
            rm -rf "dmg-$name" && mkdir "dmg-$name" && cp -R "$A" "dmg-$name/" && ln -s /Applications "dmg-$name/응용 프로그램"
            hdiutil create -volname "ODD HR" -srcfolder "dmg-$name" -ov -format UDZO "dist/ODD-HR-$VERSION-mac-$name.dmg"
            [ "$IDENTITY" = "-" ] || codesign --force --sign "$IDENTITY" "dist/ODD-HR-$VERSION-mac-$name.dmg"
            hdiutil verify "dist/ODD-HR-$VERSION-mac-$name.dmg"
            # 압축을 다시 풀어 서명이 그대로인지 확인
            rm -rf "check-$name" && mkdir "check-$name" && ditto -x -k "dist/ODD-HR-$VERSION-mac-$name.zip" "check-$name"
            codesign --verify --deep --strict "check-$name/$(basename "$A")"
          done
          ls -la dist/*.zip dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ODD-HR-Mac
          path: |
            dist/ODD-HR-*-mac-*.zip
            dist/ODD-HR-*-mac-*.dmg

  verify:
    name: 무결성 검사
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run vendor
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ODD-HR-*
      - name: 검사 (하나라도 틀리면 배포 중단)
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          node tools/verify_release.js out verified
      - uses: actions/upload-artifact@v4
        with:
          name: 검증된-배포-파일
          path: verified/

  release:
    name: 다운로드 페이지(Releases)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: 검증된-배포-파일
          path: verified
      - name: 받은 파일을 한 번 더 대조
        run: cd verified && sha256sum -c SHA256SUMS.txt
      - name: 안내문
        run: |
          {
            echo "## 받기"
            echo "- **Windows**: \`ODD-HR-Setup-${{ steps.v.outputs.version }}.exe\` (권장). 실행하면 바로 설치되고 시작 메뉴와 '설치된 앱'에 등록됩니다. 설치 없이 쓰려면 \`ODD-HR-${{ steps.v.outputs.version }}-win.zip\`"
            echo "- **Mac**: \`ODD-HR-${{ steps.v.outputs.version }}-mac-apple-silicon.dmg\` (M1~M4) 또는 \`-mac-intel.dmg\`. 열고 ODD HR을 '응용 프로그램'으로 끌어다 놓기"
            echo "- 한 번 설치하면 다음부터는 앱을 켤 때 자동으로 업데이트됩니다."
            echo "- **아이폰 · 아이패드**: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ 를 Safari로 열고 공유 → 홈 화면에 추가"
            echo ""
            echo "## 무결성 검사를 통과한 파일입니다"
            echo "압축 CRC, 앱 안 파일과 소스 일치, 공개 키만 포함, Mac 서명과 칩 종류, 서버 권한 시험과 앱 전체 흐름 시험을 모두 통과했습니다."
            echo "받은 파일은 https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/download.html 에 끌어다 놓으면 확인됩니다."
            echo ""
            echo "| 파일 | SHA-256 |"
            echo "| --- | --- |"
            while read -r h n; do echo "| $n | \`$h\` |"; done < verified/SHA256SUMS.txt
            echo ""
            echo "직접 확인: Windows \`Get-FileHash 파일 -Algorithm SHA256\` · Mac \`shasum -a 256 파일\`"
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ODD HR ${{ steps.v.outputs.version }}
          make_latest: true
          body_path: notes.md
          files: |
            verified/*.zip
            verified/*.dmg
            verified/*.exe
            verified/SHA256SUMS.txt

  web:
    name: 웹 앱 (아이폰·아이패드)과 다운로드 페이지
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: 검증된-배포-파일
          path: verified
      - name: 웹 앱 만들기 (스크립트마다 SRI 해시)
        run: DOWNLOADS_DIR=verified npm run web
      - name: 웹 파일 대조
        run: cd web && sha256sum -c SHA256SUMS.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
