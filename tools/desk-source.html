<title>ODD HR Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 디자인 원칙(Apple HIG): 명료함 · 절제 · 깊이.
   콘텐츠가 주인공이고 크롬은 물러선다. 강조색은 시스템 블루 하나, 상태는 시스템 색(빨강·주황·노랑·초록)으로만 말한다.
   층위는 반투명 사이드바와 아주 옅은 그림자로, 위계는 굵기와 크기로 만든다. 흰색 단일 테마. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --grouped: #f5f5f7;
  --fill: rgba(120, 120, 128, 0.12);
  --fill-2: rgba(120, 120, 128, 0.08);
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --faint: #8e8e93;
  --sep: rgba(60, 60, 67, 0.16);
  --sep-strong: rgba(60, 60, 67, 0.24);
  --blue: #007aff;
  --blue-press: #0062cc;
  --blue-soft: rgba(0, 122, 255, 0.1);
  --blue-text: #0066d6;
  --red: #ff3b30;   --red-text: #d70015;   --red-soft: rgba(255, 59, 48, 0.12);
  --orange: #ff9500; --orange-text: #c93400; --orange-soft: rgba(255, 149, 0, 0.14);
  --yellow-text: #a05a00; --yellow-soft: rgba(255, 204, 0, 0.2);
  --green: #34c759; --green-text: #248a3d; --green-soft: rgba(52, 199, 89, 0.14);
  --indigo-text: #5856d6; --indigo-soft: rgba(88, 86, 214, 0.12);
  --shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  --shadow-lift: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.06), 0 12px 32px rgba(0, 0, 0, 0.08);
  --r-lg: 14px; --r-md: 10px; --r-sm: 8px;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-data: var(--font-body);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.47; letter-spacing: -0.01em; margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.45) !important; }
a { color: var(--blue-text); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---- 구조: 반투명 사이드바 + 작업면 ---- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
nav.side {
  background: rgba(246, 246, 248, 0.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-right: 0.5px solid var(--sep-strong);
  padding-block: 20px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px;
  display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; z-index: 5;
}
.logo { display: flex; align-items: center; gap: 8px; padding: 2px 8px; }
.logo .mark { height: 22px; width: auto; fill: #F15524; flex: none; }
.logo .word { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; line-height: 1; }
.menu { display: grid; gap: 1px; }
.menu a {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: 7px; color: var(--ink); font-size: 14px; font-weight: 500;
  transition: background 0.15s var(--ease);
}
.menu a:hover { background: var(--fill-2); text-decoration: none; }
.menu a[aria-current="page"] { background: var(--fill); font-weight: 600; }
.menu .badge { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; min-width: 19px; height: 19px; line-height: 19px; text-align: center; }
.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); display: grid; gap: 8px; padding: 0 8px; }
.conn { display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.dot.example { background: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }

main {
  padding-block: 40px 64px; padding-left: 44px; padding-right: max(44px, env(safe-area-inset-right, 0px));
  min-width: 0; display: grid; gap: 24px; align-content: start; max-width: 1200px;
}
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px 20px; padding-bottom: 4px; }
.pagehead h1 { margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.pagehead p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---- 버튼: 채운 버튼(주 행동) 하나, 나머지는 회색 채움 ---- */
.btn {
  border: 0; background: var(--fill); color: var(--blue-text); border-radius: var(--r-sm);
  padding: 7px 14px; font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: background 0.15s var(--ease), transform 0.1s var(--ease), opacity 0.15s;
}
.btn:hover { background: rgba(120, 120, 128, 0.18); }
.btn:active { transform: scale(0.97); }
.btn.primary, .btn.accent { background: var(--blue); color: #fff; }
.btn.primary:hover, .btn.accent:hover { background: var(--blue-press); }
.btn.danger { color: var(--red-text); }
.btn.small { padding: 4px 11px; font-size: 13px; border-radius: 999px; }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }

/* ---- 그룹: 흰 카드 + 아주 옅은 그림자 ---- */
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: start; }
.box { border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; min-width: 0; background: var(--bg); box-shadow: var(--shadow); }
.box h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; }
.box h2 .n { font-size: 15px; color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.box .sub { margin: -8px 0 0; color: var(--muted); font-size: 13px; }

/* ---- 목록: 들여 쓴 구분선, 선택은 블루 틴트 ---- */
.rows { display: grid; margin: 0 -8px; }
.row {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 11px 10px; border: 0; border-radius: var(--r-md); text-align: left; background: none; width: 100%;
  transition: background 0.15s var(--ease);
}
.row + .row::before { content: ""; position: absolute; top: 0; left: 10px; right: 10px; height: 0.5px; background: var(--sep); }
.row:hover + .row::before, .row[aria-selected="true"] + .row::before, .row[aria-selected="true"]::before, button.row:hover::before { opacity: 0; }
button.row:hover { background: var(--fill-2); }
.row[aria-selected="true"] { background: var(--blue-soft); }
.row.confirm { background: var(--red-soft); }
.row .t { font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.row .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 12.5px; color: var(--muted); align-items: center; }

/* ---- 태그: 시스템 색 틴트 ---- */
.lvl { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.lvl.긴급 { background: var(--red-soft); color: var(--red-text); }
.lvl.높음 { background: var(--orange-soft); color: var(--orange-text); }
.lvl.보통 { background: var(--yellow-soft); color: var(--yellow-text); }
.lvl.낮음 { background: var(--fill-2); color: var(--muted); }
.pill { background: var(--fill-2); color: var(--muted); border-radius: 6px; padding: 1px 7px; font-size: 12px; white-space: nowrap; }
.pill.ai { background: var(--indigo-soft); color: var(--indigo-text); font-weight: 600; }
.pill.risk { background: var(--red-soft); color: var(--red-text); font-weight: 600; }
.pill.ok { background: var(--green-soft); color: var(--green-text); }
.pill.info { background: var(--blue-soft); color: var(--blue-text); }
.dday { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.dday.hot { color: var(--red-text); }

/* ---- 상세 ---- */
.detail { display: grid; gap: 16px; }
.detail h3 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; text-wrap: balance; }
.kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 0; font-size: 14px; background: var(--grouped); border-radius: var(--r-md); padding: 4px 14px; margin: 0; }
.kv dt, .kv dd { padding: 9px 0; border-top: 0.5px solid var(--sep); }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; text-align: right; display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap; align-items: center; }
.quote { background: var(--grouped); padding: 12px 14px; border-radius: var(--r-md); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---- 입력 ---- */
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea {
  border: 0; box-shadow: inset 0 0 0 0.5px var(--sep-strong); border-radius: var(--r-sm); padding: 8px 11px;
  background: var(--bg); font-size: 15px; color: var(--ink); width: 100%; min-width: 0; transition: box-shadow 0.15s var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; box-shadow: inset 0 0 0 1px var(--blue), 0 0 0 3px rgba(0, 122, 255, 0.25); }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: end; }
.form .wide { grid-column: 1 / -1; }
.msg { font-size: 13px; }
.msg.err { color: var(--red-text); }
.msg.ok { color: var(--green-text); }
.empty { color: var(--muted); font-size: 14px; padding: 28px 16px; background: var(--grouped); border-radius: var(--r-md); display: grid; gap: 10px; justify-items: center; text-align: center; }

/* ---- 할 일 동그라미 (미리 알림 방식) ---- */
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--sep-strong); background: var(--bg); display: grid; place-items: center; padding: 0; flex: none; transition: transform 0.12s var(--ease), background 0.15s; }
.check:hover { border-color: var(--blue); }
.check:active { transform: scale(0.9); }
.check.진행 { border-color: var(--blue); background: conic-gradient(var(--blue) 0 50%, transparent 50% 100%); box-shadow: inset 0 0 0 2.5px var(--bg); }
.check.검토 { border-color: var(--orange); background: conic-gradient(var(--orange) 0 75%, transparent 75% 100%); box-shadow: inset 0 0 0 2.5px var(--bg); }
.check.완료 { border-color: var(--blue); background: var(--blue); }
.check.완료::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check.막힘 { border-color: var(--red); background: var(--red-soft); }
.group-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; display: flex; gap: 6px; }
.group-title span { color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---- 필터와 칩 ---- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { border: 0; background: var(--fill-2); border-radius: var(--r-sm); padding: 6px 10px; font-size: 13.5px; font-weight: 500; }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--fill-2); color: var(--ink); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 500; transition: background 0.15s var(--ease); }
.chip:hover { background: var(--fill); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* ---- 목표 ---- */
.goal { padding: 14px 0; display: grid; gap: 9px; position: relative; }
.goal + .goal::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 0.5px; background: var(--sep); }
.goal:first-child { padding-top: 0; }
.goal .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.goal .name { font-weight: 600; }
.goal.child { padding-left: 24px; }
.goal.child::before { left: 24px !important; }
.progress { height: 6px; background: var(--fill); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.4s var(--ease); }
.goal.child .progress span { background: #5ac8fa; }
.pct { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- 세그먼트 컨트롤 ---- */
.tabs { display: inline-flex; gap: 2px; background: var(--fill); padding: 2px; border-radius: 9px; justify-self: start; max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 5px 16px; color: var(--ink); font-size: 13px; font-weight: 500; border-radius: 7px; white-space: nowrap; transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease); }
.tabs button[aria-selected="true"] { background: var(--bg); font-weight: 600; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.04), 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); }

/* ---- 에이전트 카드와 숫자 ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.card { border-radius: var(--r-lg); padding: 20px; display: grid; gap: 10px; align-content: start; background: var(--bg); box-shadow: var(--shadow); transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease); }
.card:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.card h3 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.card ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink); display: grid; gap: 3px; }
.card ul li::marker { color: var(--faint); }
.card .lab { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.stat { display: flex; gap: 28px; flex-wrap: wrap; }
.stat div { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.lights { display: inline-flex; gap: 2px; background: var(--fill); padding: 2px; border-radius: 8px; }
.lights button { border: 0; background: none; border-radius: 6px; padding: 2px 10px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.lights button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
.lights button[aria-pressed="true"].g { color: var(--green-text); }
.lights button[aria-pressed="true"].y { color: var(--yellow-text); }
.lights button[aria-pressed="true"].r { color: var(--red-text); }
.notice { font-size: 13.5px; color: var(--ink); background: var(--grouped); border-radius: var(--r-md); padding: 12px 16px; }

/* ---- 폰: 아래 탭 막대 ---- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.side {
    position: fixed; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; gap: 0; z-index: 20;
    border-right: 0; border-top: 0.5px solid var(--sep-strong);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .logo, .side .foot { display: none; }
  .menu { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; gap: 0; }
  .menu a { flex-direction: column; justify-content: center; gap: 0; padding: 7px 2px; font-size: 11px; color: var(--muted); border-radius: 8px; white-space: nowrap; }
  .menu a[aria-current="page"] { background: none; color: var(--blue); }
  .menu .badge { position: absolute; top: 0; right: 14%; font-size: 10.5px; min-width: 17px; height: 17px; line-height: 17px; padding: 0 5px; }
  main { padding-block: 24px calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 20px; }
  .pagehead h1 { font-size: 28px; }
  .box { padding: 16px; }
  .grid2, .split { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: 76px minmax(0, 1fr); }
}
/* ---- 메뉴 아이콘 (선 굵기 1.7, 둥근 끝) ---- */
.menu a { justify-content: flex-start; }
.menu a::before { content: ""; width: 19px; height: 19px; flex: none; background: var(--blue); -webkit-mask: no-repeat center / contain; mask: no-repeat center / contain; }
.menu .badge { margin-left: auto; }

.menu a[href="#tasks"]::before { -webkit-mask-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M3%2013.5h5l1.5%202.5h5l1.5-2.5h5%22/%3E%3Cpath%20d%3D%22M5.5%205h13l2.5%208.5V19a1%201%200%200%201-1%201H4a1%201%200%200%201-1-1v-5.5z%22/%3E%3C/svg%3E"); mask-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M3%2013.5h5l1.5%202.5h5l1.5-2.5h5%22/%3E%3Cpath%20d%3D%22M5.5%205h13l2.5%208.5V19a1%201%200%200%201-1%201H4a1%201%200%200%201-1-1v-5.5z%22/%3E%3C/svg%3E"); }

<script>
(() => {
  // ---------- 설정 ----------
  const APP = window.oddhrApp || null;   // 앱(데스크톱, 웹)에서만 있다. 팀 서버, 멤버, 파일 저장소
  const KEYS = ["tasks", "goals", "meetings"];
  const LINKS = { plan: "https://claude.ai/artifact/FXvnXtdmjQ1XKd1XSzbReR" };
  const PROJECTS = ["양천경찰서 영상", "장기실종아동 공모전", "30km/h 표지판의 시선", "블렌더 AI VFX 스터디", "미분류"];
  const PROJECT_DEADLINES = { "양천경찰서 영상": ["2026-11-27", "편집 완료"], "장기실종아동 공모전": ["2026-12-01", "접수 마감"] };
  const ROLES = ["PM", "기획", "디자인", "촬영", "편집", "미정"];
  const LEVELS = ["긴급", "높음", "보통", "낮음"];
  const RISK_WORDS = ["보내", "발송", "제출", "전달", "미루", "연기", "취소", "변경", "축소", "삭제"];
  const VIEWS = [
    ["home", "홈"], ["tasks", "작업"], ["todo", "할 일"], ["goals", "목표"], ["meetings", "미팅"], ["agents", "에이전트"]
  ];

  // ---------- 상태 ----------
  const S = {
    view: "home", mode: "pending", note: "", db: null, user: null, canWrite: null, sample: null, me: null, mcp: null, isOwner: false, isPM: false, confirmDel: null, editMeeting: null, quick: [], quickReady: false, flags: [], pc: { state: null, status: null }, weekly: null,
    data: { tasks: [], goals: [], meetings: [] },
    sel: { task: null, meeting: null }, flash: {},
    filter: { role: "전체", project: "전체", showDone: false, mine: null, toMe: false },
    msgs: [], files: [], weeklies: [], chat: { ch: null }, drive: { folder: "전체", q: "", proj: null, busy: "" }, editTask: null, minutes: null, prefill: null, newProj: null, notifOpen: false,
    meetTab: "upcoming", busy: false, aiState: null, ai: null, risk: null, dismiss: null
  };
  const $ = (id) => document.getElementById(id);

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "value") e.value = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
    }
    return e;
  }

  // ---------- 날짜 ----------
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const shift = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
  function dday(iso) {
    if (!iso) return null;
    const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);
    if (!y || !m || !d) return null;
    const now = new Date();
    return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  }
  const ddayText = (n) => n === null ? "" : n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${-n}`;
  const ddayEl = (iso) => { const n = dday(iso); return n === null ? null : h("span", { class: "dday" + (n <= 3 ? " hot" : ""), text: ddayText(n) }); };
  function whenText(iso) {
    if (!iso) return "일정 미정";
    const s = String(iso); const d = s.slice(5, 10).replace("-", "/");
    const t = s.length > 10 ? s.slice(11, 16) : "";
    return t ? `${d} ${t}` : d;
  }

  // ---------- 규칙 ----------
  function level(r) {
    if (LEVELS.includes(r["긴급도"])) return r["긴급도"];
    const n = dday(r["마감"]);
    if (n !== null && n <= 0) return "긴급";
    if (n !== null && n <= 2) return "높음";
    if (n !== null && n <= 7) return "보통";
    return "낮음";
  }
  const levelRank = (r) => LEVELS.indexOf(level(r));
  const risky = (r) => RISK_WORDS.some((w) => String(r["할 일"] || "").includes(w));
  const statusOf = (r) => r["상태"] || "제안";
  const roleOk = (r) => S.filter.role === "전체" || r["담당 역할"] === S.filter.role;
  const projOk = (r) => S.filter.project === "전체" || (r["프로젝트"] || "미분류") === S.filter.project;
  const proposals = () => S.data.tasks.filter((r) => statusOf(r) === "제안").sort((a, b) => levelRank(a) - levelRank(b) || (dday(a["마감"]) ?? 999) - (dday(b["마감"]) ?? 999));
  const openTodos = () => S.data.tasks.filter((r) => ["대기", "진행", "검토 요청", "막힘"].includes(statusOf(r)));

  // ---------- 사람 (프로젝트 멤버) ----------
  const pidOf = (pname) => (APP ? APP.projectId(pname) : null);
  const membersOf = (pname) => (APP ? APP.members.filter((m) => m.project_id === pidOf(pname)) : []);
  const meIn = (pname) => (APP ? APP.myMember(pidOf(pname)) || APP.myMember(APP.currentProject) || null : null);
  const myNameFor = (pname) => (meIn(pname) || {}).name || "";
  const isPMof = (pname) => (APP ? APP.isPM(pidOf(pname)) : S.isPM);
  const isMine = (r) => { const m = APP ? APP.myMember(pidOf(r["프로젝트"])) : null; if (!m) return false; return r["담당자"] ? r["담당자"] === m.name : r["담당 역할"] === m.role; };
  const curProjName = () => (APP ? APP.projectName(APP.currentProject) : "") || PROJECTS[0] || "미분류";
  const projSel = (cur) => PROJECTS.map((p) => { const o = h("option", { value: p, text: p }); if (p === (cur || curProjName())) o.selected = true; return o; });
  const T = (iso) => { const t = Date.parse(iso || ""); return isNaN(t) ? 0 : t; };
  const hm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const mondayOf = (d) => { const m = new Date(d); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); m.setHours(0, 0, 0, 0); return m; };
  const sizeText = (n) => { n = Number(n) || 0; return n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : n >= 1024 ? `${Math.round(n / 1024)}KB` : `${n}B`; };

  // ---------- 날짜 선택기 (브라우저 기본 달력에 기대지 않음) ----------
  const WD_KO = ["월", "화", "수", "목", "금", "토", "일"];
  const pad2 = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fromIso = (v) => { const [y, m, d] = String(v).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const prettyDate = (v) => { const d = fromIso(v); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD_KO[(d.getDay() + 6) % 7]})`; };
  let openPop = null;
  document.addEventListener("pointerdown", (e) => { if (openPop && !openPop.wrap.contains(e.target)) openPop.close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openPop) { const b = openPop.btn; openPop.close(); b.focus(); } });

  // name: 폼이 읽는 이름 (숨은 input). opts.quick: [[라벨, ISO]] 추가 빠른 선택. opts.time: 시간도 고름. opts.onchange(v)
  function dateField(name, label, opts = {}) {
    const hidden = h("input", { type: "hidden", name, id: name });
    const btn = h("button", { type: "button", class: "dp-btn", "aria-haspopup": "dialog", "aria-expanded": "false" });
    const clear = h("button", { type: "button", class: "dp-clear", "aria-label": `${label} 지우기`, text: "×" });
    const pop = h("div", { class: "dp-pop", hidden: true, role: "dialog", "aria-label": `${label} 고르기` });
    const wrap = h("div", { class: "dp" }, h("div", { class: "dp-row" }, btn, clear), pop);
    let val = "", time = "", view = new Date();
    const out = () => opts.time ? (val ? (time ? `${val}T${time}` : val) : "") : val;
    const paintBtn = () => {
      btn.textContent = val ? `${prettyDate(val)}${opts.time && time ? ` ${time}` : ""}` : (opts.placeholder || "날짜 고르기");
      btn.classList.toggle("empty", !val);
      clear.hidden = !val;

      if (t.includes(key) || (p.includes("공모전") && t.includes("공모전")) || (p.includes("경찰서") && /경찰서|양천/.test(t))) { proj = { p, d, what, n: dday(d) }; break; }
    }
    let bucket, why;
    if (NOW_WORDS.test(t) || (hours !== null && hours <= 3)) { bucket = "지금"; why = hours !== null ? (hours < 0 ? "기한이 지났습니다" : `${hours < 1 ? Math.max(1, Math.round(hours * 60)) + "분" : Math.round(hours * 10) / 10 + "시간"} 남음`) : "급하다고 적었습니다"; }
    else if (hours !== null && deadline && ymd(deadline) === today) { bucket = "오늘"; why = `오늘 ${pad2(deadline.getHours())}:${pad2(deadline.getMinutes())}까지${tm ? ` · ${Math.round(hours)}시간 남음` : ""}`; }
    else if (hours === null) { bucket = "오늘"; why = "기한을 안 적어 오늘 할 일로 봅니다"; }
    else if (hours <= 48) { bucket = "내일"; why = `${deadline.getMonth() + 1}/${deadline.getDate()}${tm ? ` ${pad2(deadline.getHours())}:${pad2(deadline.getMinutes())}` : ""}까지`; }
    else if (hours <= 24 * 7) { bucket = "이번 주"; why = `${deadline.getMonth() + 1}/${deadline.getDate()}까지 · D-${dday(ymd(deadline))}`; }
    else { bucket = "나중"; why = `${deadline.getMonth() + 1}/${deadline.getDate()}까지`; }
    const order = ["지금", "오늘", "내일", "이번 주", "나중"];
    if (proj && proj.n !== null && proj.n <= 7 && bucket !== "지금") {
      bucket = order[Math.max(0, order.indexOf(bucket) - 1)];
      why += ` · ${proj.p} ${proj.what} D-${proj.n}라 앞당김`;
    }
    return { kind, bucket, why, deadline, rank: order.indexOf(bucket) * 1e13 + (deadline ? deadline.getTime() : now.getTime() + 864e5) };
  }

    if (!lines.length) return 0;

    for (const text of lines) {

      "너는 영상 제작 팀의 미팅 기록을 정리하는 도우미다. 아래 미팅 노트만 근거로 정리한다. 노트에 없는 내용은 만들지 않는다.",

      `오늘 날짜: ${ymd(new Date())}. "내일", "금요일" 같은 말은 미팅 날짜 기준으로 YYYY-MM-DD로 바꾼다. 날짜가 없으면 null.`,
      "담당 역할은 PM, 기획, 디자인, 촬영, 편집, 미정 중 하나.",

      "",
      `미팅 제목: ${m["제목"] || ""}`,
      `미팅 날짜: ${String(m["일시"] || "미정").slice(0, 10)}`,
      `종류: ${m["종류"] || ""} / 참석자: ${m["참석자"] || ""}`,
      `아젠다: ${m["아젠다"] || ""}`,
      "노트:",
      String(note).slice(0, 12000)

    try {
      const out = await S.sample.json(prompt);
      const actions = Array.isArray(out && out.actions) ? out.actions.filter((a) => a && a.title).map((a) => ({ title: String(a.title).slice(0, 200), role: ROLES.includes(a.role) ? a.role : "미정", due: /^\d{4}-\d{2}-\d{2}$/.test(String(a.due || "")) ? a.due : null })) : [];

      if (c === "not_granted" || c === "sampling_disabled") S.sample = null;

    render();
  }

    cmd("🎙", "말로 할 일 올리기", "", () => { go("home"); setTimeout(() => { const b = document.querySelector(".voice .btn.mic"); if (b) { b.scrollIntoView({ block: "center" }); b.click(); } }, 80); }, "음성 받아쓰기");
    cmd("!", "오늘 결정할 것 적기", "", () => openQuick({ kind: "오늘 결정" }), "결정 바");
    if (APP && APP.agentAvailable && S.isPM) cmd("↻", "지금 카톡 점검하기", "", () => pcSync(true), "카카오톡");
    if (APP) cmd("✦", "새 기능 보기", APP.version ? `버전 ${APP.version}` : "", () => openWhatsNew(true), "업데이트 변경");
    VIEWS.forEach(([k, l]) => cmd("#", `${l} 화면`, "이동", () => go(k), k));
    if (s) {
      S.data.tasks.filter((r) => !["기각"].includes(statusOf(r)) && hit(`${r["할 일"]} ${r["담당자"] || ""} ${r["프로젝트"] || ""}`)).slice(0, 8)
        .forEach((r) => out.push({ icon: "☐", label: r["할 일"], sub: [statusOf(r), r["담당자"] || r["담당 역할"], r["마감"] ? r["마감"].slice(5).replace("-", "/") : ""].filter(Boolean).join(" · "), fn: () => openTask(r.url) }));
      if (APP) {
        const seen = new Set();
        APP.members.filter((m) => m.user_id !== S.me && hit(`${m.name} ${m.role}`)).forEach((m) => { if (seen.has(m.user_id)) return; seen.add(m.user_id); out.push({ icon: m.name.slice(0, 1), label: `${m.name}`, sub: `${m.role} · 메시지 보내기`, fn: () => openChat(`d:${m.user_id}`) }); });
        S.files.filter((f) => hit(`${f["이름"]} ${f["메모"] || ""}`)).slice(0, 6).forEach((f) => out.push({ icon: "▤", label: f["이름"], sub: `드라이브 › ${f["프로젝트"]} › ${f["폴더"] || "기타"}`, fn: () => openFile(f, false) }));
      }
      S.data.meetings.filter((m) => hit(`${m["제목"]} ${m["노트"] || ""}`)).slice(0, 4).forEach((m) => out.push({ icon: "◷", label: m["제목"] || "(제목 없음)", sub: `미팅 · ${m["일시"] ? whenText(m["일시"]) : "일정 미정"}`, fn: () => { S.sel.meeting = m.url; go("meetings"); } }));
      S.data.goals.filter((g) => hit(g["목표"])).slice(0, 3).forEach((g) => out.push({ icon: "◎", label: g["목표"], sub: `목표 · ${Math.round((Number(g["진행률"]) || 0) * 100)}%`, fn: () => go("goals") }));
    }
    return out.slice(0, 40);
  }
  function openPalette() { S.pal = { q: "", i: 0 }; renderPalette(true); }
  function closePalette() { S.pal = null; renderPalette(); }
  function renderPalette(focus) {
    const host = layer("pal"); host.textContent = "";
    if (!S.pal) { host.className = ""; return; }
    host.className = "open";
    const items = palItems(S.pal.q); S.pal.i = Math.min(S.pal.i, Math.max(0, items.length - 1));
    const pick = (it) => { closePalette(); it.fn(); };
    const list = h("div", { class: "pal-list", role: "listbox" }, items.length ? items.map((it, i) => h("button", { type: "button", role: "option", class: "pal-item", "aria-selected": String(i === S.pal.i), onmouseenter: () => { S.pal.i = i; host.querySelectorAll(".pal-item").forEach((b, k) => b.setAttribute("aria-selected", String(k === i))); }, onclick: () => pick(it) },
      h("span", { class: "pal-ic", text: it.icon }), h("span", { class: "pal-t", text: it.label }), it.sub ? h("span", { class: "pal-s", text: it.sub }) : null)) : h("div", { class: "empty", text: "찾는 것이 없습니다." }));
    const input = h("input", { id: "palq", class: "pal-q", value: S.pal.q, placeholder: "할 일, 사람, 파일, 미팅, 화면, 명령 찾기", autocomplete: "off",
      oninput: (e) => { S.pal.q = e.target.value; S.pal.i = 0; renderPalette(); const el = $("palq"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); },
      onkeydown: (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); S.pal.i = (S.pal.i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length); host.querySelectorAll(".pal-item").forEach((b, k) => { b.setAttribute("aria-selected", String(k === S.pal.i)); if (k === S.pal.i) b.scrollIntoView({ block: "nearest" }); }); }
        else if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (items[S.pal.i]) pick(items[S.pal.i]); }
      } });
    host.appendChild(h("div", { class: "scrim", onclick: closePalette }));
    host.appendChild(h("div", { class: "modal pal", role: "dialog", "aria-label": "찾기" }, input, list,
      h("div", { class: "pal-foot" }, h("span", { text: `↑↓ 고르기 · Enter 열기 · Esc 닫기` }), h("span", { text: `${MOD} K 찾기 · ${MOD} N 새로 만들기` }))));
    if (focus) setTimeout(() => { const el = $("palq"); if (el) el.focus(); }, 0);
  }

  // ---------- 새 기능 (업데이트 뒤 처음 켤 때) ----------
  const CHANGES = [
    { v: "0.3.0", title: "흐름이 끊기지 않게", items: [
      ["옆 패널", "알림, 제안, 할 일을 누르면 지금 화면 위 오른쪽에 열립니다. 상태 바꾸기, 수락, 담당자·마감 고치기, 담당자에게 메시지, 파일 붙이기까지 그 안에서 끝납니다.", null],
      ["알림에서 바로 처리", "알림 줄에서 수락, 넘기기, 승인, 답장을 누릅니다. 다른 화면으로 가지 않습니다.", () => go("home")],
      ["어디서나 만들기", `${MOD} N 또는 위쪽 '+ 새로 만들기'로 할 일, 업무 요청, 메시지, 오늘 결정을 그 자리에서 만듭니다.`, () => openQuick({ kind: "할 일" })],
      ["찾기와 명령", `${MOD} K로 할 일, 사람, 파일, 미팅, 화면, 명령을 한 번에 찾습니다.`, () => openPalette()],
      ["되돌리기", "상태를 바꾸면 아래에 6초 동안 '되돌리기'가 뜹니다.", null],
      ["보던 자리 기억", "화면을 오가도 보던 위치로 돌아옵니다. 위쪽 '← 뒤로'로 이전 화면에 갑니다.", null],
      ["자동 업데이트", "앱을 켤 때 새 버전이 있으면 먼저 받아 설치하고 다시 켭니다. 받은 파일은 지문(SHA-256)을 확인한 뒤에만 설치합니다.", null]] },
    { v: "0.2.0", title: "소통과 자료", items: [
      ["메시지·드라이브", "팀 대화방, 1:1 메시지, 파일 위치 보내기, 프로젝트 자료함.", () => go("messages")],
      ["업무 요청", "PM이 보낸 요청이 홈 '들어온 업무 요청'에 뜹니다.", null],
      ["양식", "계약서 작성 도우미와 프로젝트 브리프.", () => go("forms")],
      ["말로 할 일 올리기, 회의록 양식, 주간 업데이트, 목표 확인 알림", "", null]] }
  ];
  function openWhatsNew(force) {
    if (!APP) return;
    const seen = lsGet("oddhr.seenVersion");
    if (!force && (!APP.version || seen === APP.version)) return;
    if (!force && !seen) { lsSet("oddhr.seenVersion", APP.version); return; }   // 처음 설치한 사람에게는 시작하기가 있으니 띄우지 않는다
    const host = layer("wn"); host.textContent = ""; host.className = "open";
    const close = () => { lsSet("oddhr.seenVersion", APP.version); host.className = ""; host.textContent = ""; };
    const cur = CHANGES.find((c) => c.v === APP.version) || CHANGES[0];
    host.appendChild(h("div", { class: "scrim", onclick: close }));
    host.appendChild(h("div", { class: "modal wn", role: "dialog", "aria-label": "새 기능" },
      h("div", { class: "wn-head" }, h("span", { class: "pill ai", text: `새 버전 ${APP.version || cur.v}` }), h("h2", { text: cur.title }), h("p", { class: "sub", text: "업데이트를 마쳤습니다. 바뀐 것을 한 번 보고 시작하세요." })),
      h("div", { class: "wn-list" }, cur.items.map(([t, d, tryIt]) => h("div", { class: "wn-item" }, h("div", {}, h("strong", { text: t }), d ? h("p", { text: d }) : null), tryIt ? h("button", { class: "btn small", type: "button", text: "써 보기", onclick: () => { close(); tryIt(); } }) : null))),
      CHANGES.length > 1 ? h("details", { class: "wn-old" }, h("summary", { text: "지난 버전" }), CHANGES.filter((c) => c !== cur).map((c) => h("div", {}, h("strong", { text: `${c.v} · ${c.title}` }), h("ul", {}, c.items.map(([t, d]) => h("li", { text: d ? `${t}: ${d}` : t })))))) : null,
      h("div", { class: "actions" }, h("span", { style: "flex:1" }), h("button", { class: "btn primary", type: "button", "data-autofocus": "", text: "시작하기", onclick: close }))));
    setTimeout(() => { const b = host.querySelector("[data-autofocus]"); if (b) b.focus({ preventScroll: true }); const m = host.querySelector(".modal"); if (m) m.scrollTop = 0; }, 0);
  }

  // ---------- 위쪽 막대: 뒤로, 찾기, 새로 만들기 ----------
  function topBar() {
    return h("div", { class: "topbar" },
      S.navDepth > 0 ? h("button", { class: "btn small ghost", type: "button", text: "← 뒤로", onclick: () => history.back() }) : h("span"),
      h("button", { class: "searchbox", type: "button", onclick: openPalette, "aria-label": "찾기와 명령" }, h("span", { text: "할 일, 사람, 파일, 명령 찾기" }), h("span", { class: "kbd", text: `${MOD} K` })),
      h("button", { class: "btn primary small", type: "button", onclick: () => openQuick({ kind: "할 일" }), title: `${MOD} N` }, "+ 새로 만들기"));
  }

  // ---------- 단축키 ----------
  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === "k" || e.key === "K")) { e.preventDefault(); S.pal ? closePalette() : openPalette(); return; }
    if (mod && (e.key === "n" || e.key === "N")) { e.preventDefault(); openQuick({ kind: "할 일" }); return; }
    if (e.key === "Escape") {
      if ($("wn") && $("wn").className === "open") { const b = $("wn").querySelector(".btn.primary"); if (b) b.click(); return; }
      if (S.pal) { closePalette(); return; }
      if (S.qa) { if (document.querySelector("#qa .dp-pop:not([hidden])")) return; closeQuick(); return; }
      if (S.drawer) { if (document.querySelector("#drawer .dp-pop:not([hidden])")) return; closeDrawer(); return; }
    }
    if (e.key === "/" && !mod && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); openPalette(); }
  });

  // ---------- 렌더 ----------
  function renderMenu() {
    const m = $("menu"); m.textContent = "";
    const counts = { tasks: proposals().length, todo: S.data.tasks.filter((r) => statusOf(r) === "검토 요청").length };
    if (APP && S.me) { counts.home = unreadNotifs().length; counts.messages = channels().reduce((n, c) => n + unreadIn(c.id), 0); }
    // 좁은 화면(아이폰)에서는 자주 쓰는 4개만 아래 막대에 두고 나머지는 '더보기'에 넣는다
    const PRIMARY = APP ? ["home", "todo", "messages", "drive"] : ["home", "tasks", "todo", "meetings"];
    const moreCount = VIEWS.filter(([k]) => !PRIMARY.includes(k)).reduce((n, [k]) => n + (counts[k] || 0), 0);
    const link = (k, l, cls) => h("a", { href: `#${k}`, class: cls, "aria-current": S.view === k ? "page" : null, onclick: () => { S.moreOpen = false; m.classList.remove("open"); } }, l, counts[k] ? h("span", { class: "badge", text: String(counts[k]) }) : null);
    VIEWS.forEach(([k, l]) => m.appendChild(link(k, l, PRIMARY.includes(k) ? "" : "more-item")));
    m.appendChild(h("button", { class: "more-btn", type: "button", "aria-expanded": String(!!S.moreOpen), "aria-current": !PRIMARY.includes(S.view) ? "page" : null, onclick: () => { S.moreOpen = !S.moreOpen; m.classList.toggle("open", S.moreOpen); const b = m.querySelector(".more-btn"); if (b) b.setAttribute("aria-expanded", String(S.moreOpen)); } }, "더보기", moreCount ? h("span", { class: "badge", text: String(moreCount) }) : null));
    m.appendChild(h("div", { class: "more-sheet", role: "menu" }, VIEWS.filter(([k]) => !PRIMARY.includes(k)).map(([k, l]) => link(k, l, "sheet-item"))));
    m.classList.toggle("open", !!S.moreOpen);
    $("dot").className = "dot" + (S.mode === "live" ? " live" : S.mode === "example" ? " example" : "");
    $("conn").textContent = S.mode === "live" ? `실시간 저장${S.canWrite === false ? " · 보기 전용" : ""}${S.note ? " · " + S.note : ""}` : S.mode === "example" ? `예시 데이터${S.note ? " · " + S.note : ""}` : "연결 확인 중";
  }
  function render() {
    renderMenu();
    const main = $("main");
    // 다시 그려도 저장 전 입력값은 남긴다 (같은 화면, 같은 선택일 때만)
    const scope = `${S.view}|${S.sel.task}|${S.sel.meeting}|${S.sel.goal}|${S.chat.ch}|${S.editTask}`;
    const keep = {};
    if (!S.clearDrafts && render.scope === scope) main.querySelectorAll("input[id], textarea[id], select[id]").forEach((el) => { if (!["file", "checkbox"].includes(el.type)) keep[el.id] = el.value; });
    S.clearDrafts = false; render.scope = scope;
    main.textContent = "";
    main.appendChild(topBar());
    if (S.view === "home" && typeof installNotice === "function") { const n = installNotice(); if (n) main.appendChild(n); }
    if (S.view === "tasks" && S.flash.pc) main.appendChild(flashEl("pc"));
    if (S.mode === "live" && S.canWrite === false) main.appendChild(h("div", { class: "notice" }, "보기 권한으로 열었습니다. 승인, 상태 변경, 새로 만들기를 하려면 PM에게 참여자(Contributor) 권한을 요청하세요."));
    if (APP && APP.projects.length > 1) main.appendChild(h("div", { class: "mproj" }, h("span", { text: "기본 프로젝트" }), h("select", { "aria-label": "기본 프로젝트", onchange: (e) => APP.setCurrentProject(APP.projectId(e.target.value)) }, projSel(curProjName()))));
    if (S.mode === "example") main.appendChild(h("div", { class: "notice" }, "지금은 예시 데이터를 보여 주고 있습니다. 여기서 누른 버튼은 저장되지 않습니다. ", S.note ? S.note : ""));
    const v = { home: viewHome, tasks: viewTasks, todo: viewTodo, goals: viewGoals, meetings: viewMeetings, agents: viewAgents }[S.view] || viewHome;
    [v()].flat(Infinity).forEach((n) => n && main.appendChild(n));
    for (const [id, val] of Object.entries(keep)) {
      const el = document.getElementById(id);
      if (!el || el.value === val) continue;
      if (el.__dpSet) el.__dpSet(val); else el.value = val;
    }
    if (S.drawer && !inLayer()) renderDrawer();
    if (APP && S.me && S.mode === "live" && !S.wnChecked) { S.wnChecked = true; setTimeout(() => openWhatsNew(), 300); }
  }
  function go(view) { if (location.hash !== `#${view}`) location.hash = view; else { S.view = view; render(); } }
  document.addEventListener("pointerdown", (e) => { if (S.moreOpen && !e.target.closest("#menu")) { S.moreOpen = false; renderMenu(); } });
  S.scroll = {}; S.navDepth = 0;
  function fromHash() {
    S.moreOpen = false;
    S.scroll[S.view] = window.scrollY;
    const k = location.hash.replace("#", ""), prev = S.view;
    S.view = VIEWS.some(([v]) => v === k) ? k : "home";
    // 뒤로 가기용 깊이: 기록마다 붙여 두고, 뒤로 가면 그 기록의 값을 읽는다
    try { if (!history.state || history.state.d === undefined) history.replaceState({ d: prev !== S.view ? S.navDepth + 1 : S.navDepth }, ""); S.navDepth = history.state.d; } catch (e) {}
    render(); window.scrollTo(0, S.scroll[S.view] || 0);
  }
  try { if (!history.state) history.replaceState({ d: 0 }, ""); } catch (e) {}
  window.addEventListener("hashchange", fromHash);

  $("refresh").addEventListener("click", () => {
    if (!S.db) { render(); return; }
    S.note = "다시 불러오는 중"; renderMenu(); subscribe(); subscribeExtra();
  });

  S.view = (VIEWS.find(([v]) => v === location.hash.replace("#", "")) || ["home"])[0];
  render();

  const use = (n) => window.claude && typeof window.claude.use === "function" ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  use("sample").then((s) => { S.sample = s; if (S.view === "meetings") render(); });
  use("user").then(async (u) => {
    S.user = u;
    if (!u) return;
    try { S.canWrite = await u.can("data.write"); } catch (e) {}
    try { S.me = await u.id(); } catch (e) {}
    subscribeQuick();
    try { S.isOwner = !!(await u.isOwner()); } catch (e) {}
    try { S.isPM = S.isOwner || !!(await u.canEdit()); } catch (e) { S.isPM = S.isOwner; }
    maybeAutoSync();
    if (S.mode !== "pending") paint();
  });
  use("db").then((db) => {
    if (!db) { useExample("저장소를 쓸 수 없는 화면입니다 (로그인하지 않았거나 미리보기)"); return; }
    S.db = db;
    subscribe();
    subscribeFlags();
    subscribeQuick();
    subscribeExtra();
    maybeAutoSync();
  });
  use("mcp").then((m) => { S.mcp = m; maybeAutoSync(); });
  let autoTried = false;
  function maybeAutoSync() {
    // 이 기기에서 한 번이라도 PC 에이전트와 연결된 적이 있을 때만, Desk 주인 화면에서 조용히 가져온다
    if (autoTried || !S.db || !S.mcp || !S.isOwner || lsGet("oddhr.pc") !== "1") return;
    autoTried = true;
    pcSync(false, true);
  }
})();
</script>
